name: Build APK from zip
on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip latest project zip
        run: |
          Z=$(ls *.zip | sort -V | tail -1)
          echo "Using $Z"
          unzip -q "$Z" -d src
          D=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "Project dir: $D"
          echo "DIR=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleRelease --no-daemon
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.DIR }}/app/build/outputs/apk/release/app-release.apk
          
